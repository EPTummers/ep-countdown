# Genereert de countdown-GIF's en publiceert ze op GitHub Pages.
# Instelling vooraf: Settings → Pages → Source: "GitHub Actions".
name: Countdown bijwerken

on:
  schedule:
    # Elke 5 minuten (het minimum van GitHub), net naast het hele uur
    # omdat GitHub op :00 het drukst is. GitHub vertraagt deze runs in de praktijk
    # tot soms uren; de job 'volgende' hieronder zorgt daarom voor de echte 5 minuten.
    - cron: "2-59/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch: # handmatig starten via het tabblad Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      lopend: ${{ steps.genereren.outputs.lopend }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Lettertype controleren
        run: |
          if ! ls fonts/*.ttf fonts/*.otf >/dev/null 2>&1 && \
             [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          fi

      - name: Pillow installeren
        run: pip install -r requirements.txt

      # --offset 60: de GIF staat ongeveer een minuut na het genereren online,
      # dus het aftellen begint vanaf dat moment.
      - name: GIF's genereren
        id: genereren
        run: python scripts/generate_countdown.py --offset 60

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Zolang er een campagne loopt, start deze job na 4 minuten wachten zelf de
  # volgende run. Zo wordt de GIF ongeveer elke 5 minuten vernieuwd, zonder
  # afhankelijk te zijn van de (trage) planning van GitHub of een computer die aanstaat.
  # Is de laatste campagne langer dan 30 minuten afgelopen, dan stopt de ketting.
  volgende:
    needs: [build, deploy]
    if: ${{ always() && needs.build.outputs.lopend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wachten en volgende run starten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 240
          gh workflow run countdown.yml --ref main
